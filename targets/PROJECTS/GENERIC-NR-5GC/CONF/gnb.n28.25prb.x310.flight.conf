# Flight bench example: adapt radio/core addresses and subscriber to your setup.
# Run from the repository root; see tools/flight_test/READMEsummary.md.
# Flight delay-margin profile: unrestricted long format 1.
# Detector: floor(279*1024/839)=340 bins; last bin =132.421875 us one-way.
# This is search coverage, not a measured maximum working distance.
# n28 / 25 PRB / mu=0 / SISO; DL 765.750 MHz, UL 710.750 MHz.
# Direct RF 1 cable, 30 dB attenuation in each direction.
# X310 / NI USRP-2944R; subdevice B:0, TX/RX TX and RX2 RX.
# July long format 1 PRACH, configuration index 46, ZCZ=14 (NCS=279); no calibrated RF power claim.

usrp-tx-thread-config = 1;
E = 0;
Active_gNBs = ("x310-n28-flight");

gNBs = ({
  gNB_name = "x310-n28-flight";
  gNB_ID = 0x1f2e3e;
  nr_cellid = 8369987585L;
  tracking_area_code = 1;
  plmn_list = ({
    mcc = 1;
    mnc = 1;
    mnc_length = 2;
    snssaiList = ({ sst = 1; sd = 0xFFFFFF; });
  });

  pdsch_AntennaPorts_N1 = 1;
  pdsch_AntennaPorts_N2 = 1;
  pdsch_AntennaPorts_XP = 1;
  pusch_AntennaPorts = 1;
  maxMIMO_layers = 1;
  force_256qam_off = 1;
  force_UL256qam_off = 1;
  min_rxtxtime = 6;
  num_dlharq = 16;
  num_ulharq = 16;
  disable_harq = 0;

  servingCellConfigCommon = ({
    physCellId = 0;
    dl_frequencyBand = 28;
    dl_absoluteFrequencyPointA = 152700;
    absoluteFrequencySSB = 153150;
    dl_offstToCarrier = 0;
    dl_subcarrierSpacing = 0;
    dl_carrierBandwidth = 25;
    initialDLBWPlocationAndBandwidth = 6600;
    initialDLBWPsubcarrierSpacing = 0;
    initialDLBWPcontrolResourceSetZero = 1;
    initialDLBWPsearchSpaceZero = 3;

    ul_frequencyBand = 28;
    ul_absoluteFrequencyPointA = 141700;
    ul_offstToCarrier = 0;
    ul_subcarrierSpacing = 0;
    ul_carrierBandwidth = 25;
    pMax = 20;
    initialULBWPlocationAndBandwidth = 6600;
    initialULBWPsubcarrierSpacing = 0;

    prach_ConfigurationIndex = 46;
    prach_msg1_FDM = 0;
    prach_msg1_FrequencyStart = 0;
    zeroCorrelationZoneConfig = 14;
    preambleReceivedTargetPower = -118;
    preambleTransMax = 6;
    powerRampingStep = 1;
    ra_ResponseWindow = 4;
    ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR = 4;
    ssb_perRACH_OccasionAndCB_PreamblesPerSSB = 0;
    ra_ContentionResolutionTimer = 7;
    rsrp_ThresholdSSB = 25;
    prach_RootSequenceIndex_PR = 1;
    prach_RootSequenceIndex = 1;
    msg1_SubcarrierSpacing = -1;
    restrictedSetConfig = 0;
    msg3_DeltaPreamble = 1;
    p0_NominalWithGrant = -90;
    pucchGroupHopping = 0;
    hoppingId = 40;
    p0_nominal = -90;
    ssb_PositionsInBurst_Bitmap = 1;
    ssb_periodicityServingCell = 2;
    dmrs_TypeA_Position = 0;
    subcarrierSpacing = 0;
    ssPBCH_BlockPower = -25;
  });

  SCTP = { SCTP_INSTREAMS = 2; SCTP_OUTSTREAMS = 2; };
  amf_ip_address = ({ ipv4 = "192.168.70.132"; });
  NETWORK_INTERFACES = {
    GNB_IPV4_ADDRESS_FOR_NG_AMF = "192.168.70.129/26";
    GNB_IPV4_ADDRESS_FOR_NGU = "192.168.70.129/26";
    GNB_PORT_FOR_NGU = 2152;
  };
});

MACRLCs = ({
  tr_s_preference = "local_L1";
  tr_n_preference = "local_RRC";
  pusch_TargetSNRx10 = 150;
  pucch_TargetSNRx10 = 150;
  dl_max_mcs = 9;
  ul_max_mcs = 9;
});
L1s = ({
  tr_n_preference = "local_mac";
  prach_dtx_threshold = 150; #150;
  pucch0_dtx_threshold = 10; #100;
  pusch_dtx_threshold = 10; #50;
  ofdm_offset_divisor = 8;
});
log_config = { global_log_level = "info"; };

RUs = ({
  local_rf = "yes";
  nb_tx = 1;
  nb_rx = 1;
  bands = [28];
  max_pdschReferenceSignalPower = -27;
  att_tx = 31;
  att_rx = 0;
  sdr_addrs = "type=x300,addr=192.168.40.2,clock_source=internal,time_source=internal";
 tx_subdev = "B:0";
 rx_subdev = "B:0";
  max_rxgain = 120;
});

# Flight capture/recovery and RX plus uncalibrated relative TX control.
flight = "log recovery";
agc-mode = "continuous";
agc-directions = "both";
tx-power-mode = "relative";
