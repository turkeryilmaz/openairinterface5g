# Flight bench example: adapt radio/core addresses and subscriber to your setup.
# Run from the repository root; see tools/flight_test/READMEsummary.md.
# n28 / 25 PRB / mu=0 / SISO; DL 765.750 MHz, UL 710.750 MHz.
# Direct RF 1 cable, 30 dB attenuation in each direction.
# X310 / NI USRP-2944R; subdevice B:0, TX/RX TX and RX2 RX.
# PRACH configuration is supplied by the serving cell; no calibrated RF power claim.

uicc0 = {
  imsi = "001010000000001";
  key = "fec86ba6eb707ed08905757b1bb44b8f";
  opc = "C42449363BBAD02B66D16BC975D77CC1";
  pdu_sessions = ({ dnn = "oai"; nssai_sst = 1; nssai_sd = 0xFFFFFF; });
};

uecap_file = "targets/PROJECTS/GENERIC-NR-5GC/CONF/uecap.n28.siso.5MHz.xml";
log_config = { global_log_level = "info"; sim_log_level = "warn"; };
thread-pool = "-1,-1,-1,-1,-1,-1,-1,-1";
usrp-tx-thread-config = 0;
E = 0;
A = 0;
band = 28;
C = 765750000;
CO = -55000000;
r = 25;
numerology = 0;
ssb = 30;
ue-fo-compensation = 1;
cont-fo-comp = 1;
ue-nb-ant-rx = 1;
ue-nb-ant-tx = 1;

usrp-args = "type=x300,addr=192.168.40.2";
tx_subdev = "B:0";
rx_subdev = "B:0";
time-source = 0;
clock-source = 0;
agc = 0;
ue-rxgain = 120;
ue-txgain = 31;

# Public OAI example key/OPc with the synthetic bench IMSI; operate one UE at a time.
# Replace this fixture with the subscriber configured in your own core.

# Flight capture/recovery and RX plus uncalibrated relative TX control.
flight = "log recovery";
agc-mode = "continuous";
agc-directions = "both";
tx-power-mode = "relative";
